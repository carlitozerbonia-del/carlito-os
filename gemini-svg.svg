<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <!-- Accent Gradient for the C and Prompt -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Square Base (GitHub Avatar Friendly) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="#334155" stroke-width="8" />

  <!-- Subtle Inner Grid/Circuit Lines -->
  <path d="M 115 0 V 512 M 397 0 V 512 M 0 115 H 512 M 0 397 H 512" stroke="#ffffff" stroke-opacity="0.03" stroke-width="4" />

  <!-- Outer Stylized 'C' for Carlito OS -->
  <path d="M 340 140 A 145 145 0 1 0 340 372" fill="none" stroke="url(#accentGrad)" stroke-width="44" stroke-linecap="round" filter="url(#glow)" />

  <!-- Terminal Prompt Inside the 'C' (>_) -->
  <path d="M 215 216 L 265 256 L 215 296" fill="none" stroke="#f8fafc" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="285" y1="296" x2="335" y2="296" stroke="#38bdf8" stroke-width="24" stroke-linecap="round" />

  <!-- Top Window Control Dots -->
  <circle cx="130" cy="85" r="10" fill="#ef4444" opacity="0.8" />
  <circle cx="165" cy="85" r="10" fill="#eab308" opacity="0.8" />
  <circle cx="200" cy="85" r="10" fill="#22c55e" opacity="0.8" />
</svg>